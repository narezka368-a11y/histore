<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Учись и играй</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}
body{background:radial-gradient(ellipse at top,rgba(201,162,39,.18),transparent 55%),linear-gradient(135deg,#0f0904,#2c1810,#1a0f08);background-attachment:fixed;color:#f5e6d3;padding:15px;min-height:100vh;transition:background .4s,color .4s}
body.light{background:radial-gradient(ellipse at top,rgba(230,200,120,.4),transparent 55%),linear-gradient(135deg,#f5eedc,#e8d8b8,#d4c094);color:#2c1810}
body.light .box{background:linear-gradient(160deg,#fbf5e5,#efe3c8);border-color:#8b6f1f}
body.light h1{color:#6b4f0f}
body.light h2{color:#6b4f0f;background:linear-gradient(90deg,rgba(139,111,31,.22),transparent);border-color:#8b6f1f}
body.light .sub{color:#8b6f1f}
body.light .card{background:linear-gradient(135deg,rgba(139,111,31,.12),rgba(139,111,31,.03));border-color:rgba(139,111,31,.5);color:#2c1810}
body.light .card b{color:#6b4f0f}
body.light .card small{color:#8b6f1f}
body.light .theme-card{background:linear-gradient(135deg,rgba(139,111,31,.15),rgba(139,111,31,.03));border-color:rgba(139,111,31,.5);color:#2c1810}
body.light .theme-card b{color:#6b4f0f}
body.light .theme-card small{color:#8b6f1f}
body.light input,body.light select{background:rgba(255,255,255,.7);border-color:#8b6f1f;color:#2c1810}
body.light .userbox{background:rgba(139,111,31,.12);border-color:rgba(139,111,31,.5)}
body.light .userbox .who b{color:#6b4f0f}
body.light .userbox .who small{color:#8b6f1f}
body.light .role{background:linear-gradient(135deg,rgba(139,111,31,.1),rgba(139,111,31,.02));border-color:rgba(139,111,31,.5);color:#2c1810}
body.light .role b{color:#6b4f0f}
body.light .role.on{background:linear-gradient(135deg,rgba(139,111,31,.35),rgba(139,111,31,.15));border-color:#6b4f0f}
body.light .st{background:linear-gradient(135deg,rgba(139,111,31,.18),rgba(139,111,31,.05));border-color:rgba(139,111,31,.5)}
body.light .st .v{color:#6b4f0f}
body.light .st .l{color:#8b6f1f}
body.light .q{background:linear-gradient(135deg,rgba(139,111,31,.14),rgba(139,111,31,.04));border-color:#8b6f1f;color:#2c1810}
body.light .a{background:rgba(255,255,255,.5);border-color:rgba(139,111,31,.5);color:#2c1810}
body.light .ex{background:rgba(139,111,31,.15);border-color:#8b6f1f;color:#2c1810}
body.light .art{color:#2c1810}
body.light .art h2{color:#6b4f0f;border-color:rgba(139,111,31,.5)}
body.light .art b{color:#6b4f0f}
body.light .quote{background:rgba(142,68,173,.1);color:#4a235a}
body.light .fact{background:rgba(41,128,185,.1);color:#1a5276}
body.light .d{background:rgba(139,111,31,.15);border-color:#8b6f1f}
body.light .d b{color:#6b4f0f}
body.light .p{background:rgba(139,111,31,.08);border-color:rgba(139,111,31,.4)}
body.light .p .nm{color:#6b4f0f}
body.light .fin{background:rgba(139,111,31,.15);color:#2c1810}
body.light .fin .g{color:#6b4f0f}
body.light .btn{background:linear-gradient(135deg,#8b6f1f,#d4a017);color:#fff}
body.light .btn2{background:rgba(139,111,31,.15);color:#2c1810;border-color:#8b6f1f}
body.light .back{background:rgba(139,111,31,.15);color:#8b6f1f;border-color:#8b6f1f}
body.light .df button{background:rgba(139,111,31,.1);border-color:#8b6f1f;color:#2c1810}
body.light .df button.on{background:linear-gradient(135deg,#8b6f1f,#d4a017);color:#fff}
body.light .cross{background:#e8d8b8;border-color:#8b6f1f}
body.light .cross .cell{background:#fbf5e5;border-color:rgba(139,111,31,.5)}
body.light .cross .cell input{color:#2c1810}
body.light .clues .col h3{color:#6b4f0f;background:rgba(139,111,31,.15)}
body.light .clues li{color:#2c1810}
body.light .topbar button{background:rgba(139,111,31,.15);color:#6b4f0f;border-color:#8b6f1f}
body.light .themeModalBox{background:linear-gradient(160deg,#fbf5e5,#efe3c8);border-color:#8b6f1f}
body.light .themeTile{background:rgba(139,111,31,.1);border-color:rgba(139,111,31,.5);color:#2c1810}
body.light .announce{background:linear-gradient(135deg,rgba(142,68,173,.15),rgba(192,57,43,.08))}
body.light .announce .text{color:#2c1810}
body.light .announce .date{color:#8b6f1f}
.box{max-width:900px;margin:20px auto;background:linear-gradient(160deg,#30200f,#1a0f08);border:3px solid #c9a227;border-radius:22px;padding:30px 26px;box-shadow:0 25px 70px rgba(0,0,0,.85);transition:background .4s,border-color .4s}
h1{color:#f4d03f;text-align:center;font-size:1.9em;margin-bottom:8px;text-shadow:0 0 20px rgba(244,208,63,.55)}
h2{color:#f4d03f;font-size:1.15em;padding:10px 14px;margin:24px 0 12px;background:linear-gradient(90deg,rgba(201,162,39,.22),transparent);border-left:4px solid #c9a227;border-radius:8px}
.sub{text-align:center;color:#c9a227;font-style:italic;margin-bottom:18px}
.hero{font-size:3.8em;text-align:center;margin-bottom:10px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.scr{display:none}
.scr.on{display:block;animation:fd .5s ease}
@keyframes fd{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.topbar button{background:rgba(201,162,39,.15);border:1px solid rgba(201,162,39,.5);color:#f4d03f;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:.9em;font-family:inherit;transition:all .3s}
input[type=text],input[type=password],select{width:100%;padding:16px;font-size:1.1em;background:rgba(255,255,255,.06);border:2px solid rgba(201,162,39,.5);border-radius:12px;color:#f5e6d3;font-family:inherit;text-align:center;margin-top:14px}
select{text-align:left;cursor:pointer}
input:focus,select:focus{outline:none;border-color:#f4d03f}
.btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#c9a227,#f4d03f);color:#2c1810;border:none;border-radius:12px;font-size:1.05em;font-weight:bold;cursor:pointer;margin-top:14px;font-family:inherit}
.btn2{background:rgba(255,255,255,.08);color:#f5e6d3;border:2px solid rgba(201,162,39,.5)}
.back{background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.35);color:#c9a227;cursor:pointer;font-size:.9em;padding:9px 14px;margin-bottom:14px;font-family:inherit;border-radius:8px}
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(135deg,rgba(201,162,39,.1),rgba(201,162,39,.02));border:2px solid rgba(201,162,39,.4);border-radius:14px;padding:16px;margin:10px 0;color:#f5e6d3;cursor:pointer;font-family:inherit;font-size:1em}
.card .ic{font-size:2.4em}
.card b{color:#f4d03f;font-size:1.15em;display:block;margin-bottom:3px}
.card small{color:#b8956a;font-size:.86em}
.theme-card{display:flex;align-items:center;gap:20px;width:100%;text-align:left;background:linear-gradient(135deg,rgba(201,162,39,.15),rgba(201,162,39,.03));border:3px solid rgba(201,162,39,.5);border-radius:18px;padding:22px;margin:14px 0;color:#f5e6d3;cursor:pointer;font-family:inherit;font-size:1em}
.theme-card .ic{font-size:3.2em;flex-shrink:0}
.theme-card b{color:#f4d03f;font-size:1.35em;display:block;margin-bottom:5px}
.theme-card small{color:#b8956a;font-size:.95em;display:block;line-height:1.4}
.theme-card .arrow{margin-left:auto;font-size:2em;color:#c9a227}
.userbox{display:flex;align-items:center;gap:12px;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:14px 16px;margin-bottom:15px}
.userbox .av{font-size:2em}
.userbox .who{flex:1}
.userbox .who b{color:#f4d03f;display:block;font-size:1.1em}
.userbox .who small{color:#b8956a;font-size:.85em}
.userbox .out{background:rgba(231,76,60,.2);border:1px solid #e74c3c;color:#e74c3c;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9em;font-family:inherit}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.role{padding:16px;background:linear-gradient(135deg,rgba(201,162,39,.08),rgba(201,162,39,.02));border:2px solid rgba(201,162,39,.4);border-radius:14px;cursor:pointer;text-align:center;font-family:inherit;color:#f5e6d3}
.role.on{background:linear-gradient(135deg,rgba(201,162,39,.35),rgba(201,162,39,.15));border-color:#f4d03f}
.role .em{font-size:2.2em;display:block;margin-bottom:6px}
.role b{color:#f4d03f;display:block;font-size:1em}
.role small{color:#b8956a;font-size:.75em}
.role .lock{font-size:.75em;color:#e74c3c;display:block;margin-top:4px}
.passbox{margin-top:18px;padding:16px;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.4);border-radius:12px;display:none}
.passbox.on{display:block}
.passbox p{text-align:center;color:#c9a227;font-size:.9em;margin-bottom:6px}
.st{display:flex;justify-content:space-around;background:linear-gradient(135deg,rgba(201,162,39,.18),rgba(201,162,39,.05));border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:14px 8px;margin-bottom:16px;text-align:center;gap:8px}
.st>div{flex:1}
.st .v{font-size:1.6em;color:#f4d03f;font-weight:bold;font-family:'Segoe UI',sans-serif}
.st .l{font-size:.72em;color:#b8956a;margin-top:3px}
.q{background:linear-gradient(135deg,rgba(201,162,39,.14),rgba(201,162,39,.04));padding:16px 18px;border-left:5px solid #c9a227;border-radius:10px;margin-bottom:16px;font-size:1.08em;line-height:1.55}
.a{display:block;width:100%;padding:15px 16px;background:rgba(255,255,255,.05);border:2px solid rgba(201,162,39,.4);border-radius:12px;color:#f5e6d3;font-size:1em;text-align:left;cursor:pointer;margin:9px 0;font-family:inherit}
.a:disabled{cursor:not-allowed;opacity:.85}
.a.ok{background:rgba(39,174,96,.55);border-color:#27ae60}
.a.no{background:rgba(231,76,60,.55);border-color:#e74c3c}
.ex{background:rgba(201,162,39,.18);border-left:5px solid #c9a227;padding:14px;border-radius:10px;margin-top:14px;display:none;line-height:1.55}
.df{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.df button{padding:11px 18px;background:rgba(255,255,255,.05);border:2px solid rgba(201,162,39,.5);border-radius:25px;color:#f5e6d3;cursor:pointer;font-family:inherit}
.df button.on{background:linear-gradient(135deg,#c9a227,#f4d03f);color:#2c1810;font-weight:bold}
.art{line-height:1.8;font-size:1em;color:#e8d8bf}
.art h2{color:#f4d03f;font-size:1.25em;margin:30px 0 14px;padding:0 0 10px;background:none;border:none;border-bottom:2px solid rgba(201,162,39,.4);border-radius:0}
.art h3{color:#c9a227;font-size:1.08em;margin:20px 0 8px}
.art p{margin-bottom:12px}
.art b{color:#f4d03f}
.art ul{margin:8px 0 14px 22px}
.art li{margin:7px 0;line-height:1.7}
.quote{background:linear-gradient(135deg,rgba(142,68,173,.15),rgba(142,68,173,.05));border-left:5px solid #8e44ad;border-radius:10px;padding:14px 18px;margin:16px 0;font-style:italic;color:#c39bd3;line-height:1.7}
.fact{background:linear-gradient(135deg,rgba(41,128,185,.15),rgba(41,128,185,.05));border-left:5px solid #2980b9;border-radius:10px;padding:14px 18px;margin:16px 0;color:#aed6f1}
.d{background:rgba(201,162,39,.15);border-left:5px solid #c9a227;padding:14px;border-radius:10px;margin:16px 0}
.d b{color:#f4d03f;display:block;margin-bottom:6px}
.d ul{list-style:none;margin:0;padding:0}
.d li{padding:6px 0;border-bottom:1px dashed rgba(201,162,39,.25);font-size:.95em}
.d li b{color:#c9a227;display:inline-block;min-width:85px}
.p{background:linear-gradient(135deg,rgba(201,162,39,.1),transparent);border:1px solid rgba(201,162,39,.35);border-radius:12px;padding:16px 18px;margin:16px 0}
.p .nm{color:#f4d03f;font-weight:bold;font-size:1.1em;display:block;margin-bottom:8px}
.fin{text-align:center;background:rgba(201,162,39,.15);padding:20px;border-radius:12px;margin:16px 0;line-height:1.6}
.fin .g{font-size:1.4em;color:#c9a227;font-weight:bold;margin-top:10px;display:block}
.cross{display:grid;gap:2px;justify-content:center;margin:20px auto;background:#1a0f08;padding:10px;border-radius:12px;border:2px solid #c9a227;max-width:100%;overflow-x:auto}
.cross .cell{width:42px;height:42px;background:#4a3020;border:1px solid rgba(201,162,39,.35);border-radius:4px;position:relative}
.cross .cell.black{background:transparent;border:none}
.cross .cell .num{position:absolute;top:2px;left:3px;font-size:.65em;color:#c9a227;font-weight:bold}
.cross .cell input{width:100%;height:100%;background:transparent;border:none;color:#f5e6d3;font-size:1.3em;text-align:center;text-transform:uppercase;font-weight:bold;font-family:inherit;padding:0;margin:0}
.cross .cell input.ok{background:rgba(39,174,96,.6);color:#fff}
.cross .cell input.no{background:rgba(231,76,60,.6);color:#fff}
.clues{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.clues .col h3{color:#f4d03f;font-size:1em;margin-bottom:10px;padding:8px 10px;background:rgba(201,162,39,.15);border-left:3px solid #c9a227;border-radius:6px}
.clues ol{margin:0 0 0 20px;padding:0;list-style:none;counter-reset:clue}
.clues li{counter-increment:clue;margin:7px 0;font-size:.93em;line-height:1.45;color:#e8d8bf;padding-left:26px;position:relative}
.clues li::before{content:counter(clue) ".";position:absolute;left:0;color:#c9a227;font-weight:bold;min-width:22px}
.announce{background:linear-gradient(135deg,rgba(142,68,173,.25),rgba(192,57,43,.15));border:2px solid #8e44ad;border-radius:14px;padding:16px 20px;margin-bottom:15px}
.announce::before{content:'📢 ОБЪЯВЛЕНИЕ';display:block;color:#c39bd3;font-size:.8em;font-weight:bold;letter-spacing:1px;margin-bottom:6px}
.announce .text{color:#f5e6d3;line-height:1.5}
.announce .date{display:block;color:#b8956a;font-size:.8em;margin-top:8px;font-style:italic}
.themeModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:1000;justify-content:center;align-items:center;padding:20px}
.themeModal.on{display:flex}
.themeModalBox{background:linear-gradient(160deg,#30200f,#1a0f08);border:3px solid #c9a227;border-radius:20px;padding:24px;max-width:420px;width:100%}
.themeModalBox h2{margin:0 0 16px;text-align:center;font-size:1.2em;padding:10px;background:linear-gradient(90deg,rgba(201,162,39,.25),transparent);border-left:4px solid #c9a227;border-radius:8px}
.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themeTile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;background:rgba(255,255,255,.06);border:2px solid rgba(201,162,39,.4);border-radius:12px;cursor:pointer;font-family:inherit;font-size:.9em;color:#f5e6d3}
.themeTile.active{border-color:#f4d03f;background:linear-gradient(135deg,rgba(201,162,39,.4),rgba(201,162,39,.15))}
.themeTile .tic{font-size:1.8em}
.themeCloseBtn{margin-top:16px;width:100%;padding:12px;background:rgba(255,255,255,.08);border:2px solid rgba(201,162,39,.5);border-radius:10px;color:inherit;cursor:pointer;font-family:inherit;font-size:1em}
@media(max-width:700px){.cross .cell{width:34px;height:34px}.clues{grid-template-columns:1fr}}
@media(max-width:600px){body{padding:8px}.box{padding:20px 15px}h1{font-size:1.5em}.hero{font-size:2.9em}.roles{grid-template-columns:1fr}.cross .cell{width:30px;height:30px}}
</style>
</head>
<body>
<div class="box">
<div class="topbar">
<button id="soundBtn" onclick="toggleSound()">🔊 Звук</button>
<button id="themeBtn" onclick="openThemeModal()">🎨 Темы</button>
</div>
