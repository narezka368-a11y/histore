<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 Историческая викторина — 6-7 класс</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 50%, #6b4423 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #f5e6d3;
    }

    .container {
        width: 100%;
        max-width: 700px;
        background: rgba(30, 18, 10, 0.95);
        border: 3px solid #c9a227;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 60px rgba(201,162,39,0.1);
    }

    h1 {
        text-align: center;
        font-size: 2em;
        color: #c9a227;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #b8956a;
        margin-bottom: 25px;
        font-style: italic;
    }

    /* Статистика */
    .stats {
        display: flex;
        justify-content: space-around;
        background: rgba(201,162,39,0.1);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 25px;
        border: 1px solid rgba(201,162,39,0.3);
    }

    .stat { text-align: center; }
    .stat-value {
        font-size: 1.8em;
        font-weight: bold;
        color: #c9a227;
    }
    .stat-label { font-size: 0.85em; color: #b8956a; }

    /* Прогресс-бар */
    .progress-bar {
        height: 8px;
        background: rgba(0,0,0,0.4);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 25px;
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #c9a227, #f4d03f);
        width: 0%;
        transition: width 0.4s ease;
    }

    /* Вопрос */
    .question {
        font-size: 1.25em;
        line-height: 1.5;
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(201,162,39,0.08);
        border-left: 4px solid #c9a227;
        border-radius: 8px;
    }

    /* Кнопки ответов */
    .answers { display: flex; flex-direction: column; gap: 12px; }

    .answer-btn {
        padding: 16px 20px;
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(201,162,39,0.4);
        border-radius: 12px;
        color: #f5e6d3;
        font-size: 1em;
        text-align: left;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    .answer-btn:hover:not(:disabled) {
        background: rgba(201,162,39,0.2);
        border-color: #c9a227;
        transform: translateX(6px);
    }

    .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }

    .answer-btn.correct {
        background: rgba(39, 174, 96, 0.35);
        border-color: #27ae60;
        animation: pulse 0.5s ease;
    }

    .answer-btn.wrong {
        background: rgba(231, 76, 60, 0.35);
        border-color: #e74c3c;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
    }

    /* Пояснение */
    .explanation {
        margin-top: 18px;
        padding: 15px;
        background: rgba(201,162,39,0.12);
        border-radius: 10px;
        border-left: 4px solid #c9a227;
        display: none;
        animation: slideDown 0.4s ease;
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Кнопка Далее */
    .btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 16px;
        background: linear-gradient(135deg, #c9a227, #f4d03f);
        color: #2c1810;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(201,162,39,0.5);
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Экраны */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Стартовый экран */
    .start-text {
        text-align: center;
        font-size: 1.1em;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    /* Финальный экран */
    .final-title {
        font-size: 2.2em;
        text-align: center;
        margin-bottom: 20px;
        color: #c9a227;
    }

    .final-score {
        font-size: 3.5em;
        text-align: center;
        font-weight: bold;
        color: #f4d03f;
        text-shadow: 0 0 20px rgba(201,162,39,0.6);
        margin: 20px 0;
    }

    .final-message {
        text-align: center;
        font-size: 1.2em;
        line-height: 1.6;
        padding: 20px;
        background: rgba(201,162,39,0.1);
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .grade {
        font-size: 1.5em;
        font-weight: bold;
        display: block;
        margin-top: 10px;
        color: #c9a227;
    }

    @media (max-width: 500px) {
        h1 { font-size: 1.5em; }
        .container { padding: 20px; }
        .stat-value { font-size: 1.4em; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>📜 Историческая викторина</h1>
    <p class="subtitle">Для 6-7 класса</p>

    <!-- ЭКРАН 1: Старт -->
    <div id="startScreen" class="screen active">
        <div class="start-text">
            <p>🏰 Проверьте свои знания по истории России!</p>
            <p style="margin-top:15px;">📖 Вопросов: <b id="totalQuestions">0</b></p>
            <p>❤️ Жизни: <b>3</b></p>
            <p>⭐ Правильный ответ: <b>+10 очков</b></p>
        </div>
        <button class="btn" onclick="startGame()">🚀 Начать игру</button>
    </div>

    <!-- ЭКРАН 2: Игра -->
    <div id="gameScreen" class="screen">
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="scoreDisplay">0</div>
                <div class="stat-label">⭐ Очки</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="livesDisplay">❤️❤️❤️</div>
                <div class="stat-label">Жизни</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="questionNum">1</div>
                <div class="stat-label">Вопрос</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="question" id="questionText"></div>
        <div class="answers" id="answersContainer"></div>

        <div class="explanation" id="explanation"></div>
        <button class="btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">
            ➡️ Следующий вопрос
        </button>
    </div>

    <!-- ЭКРАН 3: Финал -->
    <div id="finalScreen" class="screen">
        <h2 class="final-title">🏆 Игра окончена!</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="final-message" id="finalMessage"></div>
        <button class="btn" onclick="restartGame()">🔄 Играть снова</button>
    </div>
</div>

<script>
// ================= БАЗА ВОПРОСОВ =================
const questions = [
    {
        q: "В каком году произошло Крещение Руси?",
        options: ["862 г.", "988 г.", "1147 г.", "1240 г."],
        correct: 1,
        explanation: "Князь Владимир Святославич крестил Русь в 988 году."
    },
    {
        q: "Кто был первым князем Древней Руси?",
        options: ["Игорь", "Олег", "Рюрик", "Святослав"],
        correct: 2,
        explanation: "Рюрик стал первым князем в 862 году, основав династию Рюриковичей."
    },
    {
        q: "В каком году произошла Невская битва?",
        options: ["1240 г.", "1242 г.", "1380 г.", "1147 г."],
        correct: 0,
        explanation: "Александр Невский разбил шведов на реке Неве в 1240 году."
    },
    {
        q: "В каком году произошло Ледовое побоище?",
        options: ["1240 г.", "1242 г.", "1380 г.", "1480 г."],
        correct: 1,
        explanation: "5 апреля 1242 года Александр Невский разбил рыцарей Ливонского ордена на Чудском озере."
    },
    {
        q: "Кто разбил Мамая на Куликовом поле?",
        options: ["Иван III", "Дмитрий Донской", "Иван Калита", "Александр Невский"],
        correct: 1,
        explanation: "Дмитрий Донской одержал победу в Куликовской битве в 1380 году."
    },
    {
        q: "В каком году произошло Куликовская битва?",
        options: ["1380 г.", "1240 г.", "1480 г.", "1147 г."],
        correct: 0,
        explanation: "Куликовская битва состоялась 8 сентября 1380 года."
    },
    {
        q: "Кто освободил Русь от монголо-татарского ига?",
        options: ["Иван Калита", "Дмитрий Донской", "Иван III", "Иван Грозный"],
        correct: 2,
        explanation: "Иван III в 1480 году после стояния на Угре покончил с игом."
    },
    {
        q: "Что такое феодальная раздробленность?",
        options: [
            "Объединение земель вокруг Москвы",
            "Распад государства на отдельные княжества",
            "Война с монголами",
            "Крещение Руси"
        ],
        correct: 1,
        explanation: "Феодальная раздробленность — распад единого государства на независимые части (XII–XV вв.)."
    },
    {
        q: "В каком году Москва впервые упоминается в летописи?",
        options: ["862 г.", "988 г.", "1147 г.", "1240 г."],
        correct: 2,
        explanation: "Москва впервые упомянута в 1147 году в связи с Юрием Долгоруким."
    },
    {
        q: "Кто написал «Повесть временных лет»?",
        options: ["Нестор", "Иларион", "Даниил Заточник", "Кирилл Туровский"],
        correct: 0,
        explanation: "Монах Нестор создал «Повесть временных лет» в начале XII века."
    },
    {
        q: "Кто был первым русским царём?",
        options: ["Иван III", "Иван IV Грозный", "Пётр I", "Борис Годунов"],
        correct: 1,
        explanation: "Иван IV Грозный в 1547 году впервые принял титул царя."
    },
    {
        q: "В каком году было взятие Казани Иваном Грозным?",
        options: ["1547 г.", "1552 г.", "1565 г.", "1584 г."],
        correct: 1,
        explanation: "Казань была взята войсками Ивана Грозного в 1552 году."
    },
    {
        q: "Что такое опричнина?",
        options: [
            "Совет при царе",
            "Особое войско и политика террора Ивана Грозного",
            "Налог на землю",
            "Название города"
        ],
        correct: 1,
        explanation: "Опричнина (1565-1572) — политика террора Ивана Грозного против бояр."
    },
    {
        q: "Кто возглавил Второе народное ополчение в 1612 году?",
        options: [
            "Минин и Пожарский",
            "Лжедмитрий I",
            "Борис Годунов",
            "Василий Шуйский"
        ],
        correct: 0,
        explanation: "Кузьма Минин и Дмитрий Пожарский освободили Москву от поляков в 1612 году."
    },
    {
        q: "В каком году произошло Смутное время (начало)?",
        options: ["1584 г.", "1598 г.", "1605 г.", "1613 г."],
        correct: 1,
        explanation: "Смутное время началось в 1598 году после смерти царя Фёдора Иоанновича."
    }
];

// ================= ПЕРЕМЕННЫЕ =================
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let lives = 3;
let answered = false;

// ================= ЭЛЕМЕНТЫ =================
const startScreen = document.getElementById('startScreen');
const gameScreen = document.getElementById('gameScreen');
const finalScreen = document.getElementById('finalScreen');
const questionText = document.getElementById('questionText');
const answersContainer = document.getElementById('answersContainer');
const explanation = document.getElementById('explanation');
const nextBtn = document.getElementById('nextBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const questionNum = document.getElementById('questionNum');
const progressFill = document.getElementById('progressFill');
const finalScore = document.getElementById('finalScore');
const finalMessage = document.getElementById('finalMessage');

document.getElementById('totalQuestions').textContent = questions.length;

// ================= ФУНКЦИИ =================

function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
}

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startGame() {
    currentQuestions = shuffle(questions);
    currentIndex = 0;
    score = 0;
    lives = 3;
    updateStats();
    showScreen(gameScreen);
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];

    // Прогресс
    progressFill.style.width = (currentIndex / currentQuestions.length * 100) + '%';
    questionNum.textContent = (currentIndex + 1) + '/' + currentQuestions.length;

    questionText.textContent = '📖 ' + q.q;
    answersContainer.innerHTML = '';
    explanation.style.display = 'none';
    nextBtn.style.display = 'none';

    const letters = ['А', 'Б', 'В', 'Г'];
    q.options.forEach((option, i) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = `<b>${letters[i]})</b> ${option}`;
        btn.onclick = () => checkAnswer(i, btn);
        answersContainer.appendChild(btn);
    });
}

function checkAnswer(selected, btn) {
    if (answered) return;
    answered = true;

    const q = currentQuestions[currentIndex];
    const buttons = answersContainer.querySelectorAll('.answer-btn');

    buttons.forEach(b => b.disabled = true);

    if (selected === q.correct) {
        btn.classList.add('correct');
        score += 10;
        explanation.innerHTML = '✅ <b>Правильно!</b><br>' + q.explanation;
    } else {
        btn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        lives--;
        explanation.innerHTML = '❌ <b>Неверно.</b> Правильный ответ: <b>' 
            + q.options[q.correct] + '</b><br>' + q.explanation;
    }

    explanation.style.display = 'block';
    updateStats();

    // Проверка на конец
    if (lives <= 0) {
        nextBtn.textContent = '🏁 Завершить игру';
    } else if (currentIndex === currentQuestions.length - 1) {
        nextBtn.textContent = '🏆 Показать результат';
    } else {
        nextBtn.textContent = '➡️ Следующий вопрос';
    }
    nextBtn.style.display = 'block';
}

function nextQuestion() {
    if (lives <= 0 || currentIndex === currentQuestions.length - 1) {
        finishGame();
        return;
    }
    currentIndex++;
    loadQuestion();
}

function updateStats() {
    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
}

function finishGame() {
    progressFill.style.width = '100%';
    finalScore.textContent = score + ' очков';
    showScreen(finalScreen);

    const total = currentQuestions.length;
    const correctCount = score / 10;
    const percent = Math.round(correctCount / total * 100);

    let msg, grade;
    if (percent >= 90) {
        msg = "🌟 Превосходно! Вы настоящий знаток истории!";
        grade = "Оценка: 5";
    } else if (percent >= 70) {
        msg = "👍 Отличный результат! Вы хорошо знаете историю.";
        grade = "Оценка: 4";
    } else if (percent >= 50) {
        msg = "📖 Неплохо, но стоит повторить материал.";
        grade = "Оценка: 3";
    } else {
        msg = "📚 Попробуйте ещё раз — история ждёт вас!";
        grade = "Оценка: 2";
    }

    finalMessage.innerHTML = `
        Правильных ответов: <b>${correctCount} из ${total}</b><br>
        ${msg}
        <span class="grade">${grade}</span>
    `;
}

function restartGame() {
    showScreen(startScreen);
}
</script>

</body>
</html>
