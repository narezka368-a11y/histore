<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 Исторические игры — 6-7 класс</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1a0f08 0%, #2c1810 50%, #4a2c1a 100%);
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #f5e6d3;
    }

    .container {
        width: 100%;
        max-width: 750px;
        background: rgba(30, 18, 10, 0.95);
        border: 3px solid #c9a227;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    h1 {
        text-align: center;
        font-size: 2em;
        color: #c9a227;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #b8956a;
        margin-bottom: 25px;
        font-style: italic;
    }

    .hero-emblem {
        font-size: 4em;
        text-align: center;
        margin-bottom: 10px;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    .menu-intro {
        text-align: center;
        color: #d4b896;
        line-height: 1.6;
        margin-bottom: 25px;
        font-size: 1.05em;
    }

    .games-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .game-card {
        background: linear-gradient(135deg, rgba(201,162,39,0.08), rgba(201,162,39,0.02));
        border: 2px solid rgba(201,162,39,0.35);
        border-radius: 15px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 18px;
        text-align: left;
        color: inherit;
        font-family: inherit;
        width: 100%;
        font-size: 1em;
    }

    .game-card:hover {
        border-color: #c9a227;
        background: linear-gradient(135deg, rgba(201,162,39,0.2), rgba(201,162,39,0.05));
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(201,162,39,0.3);
    }

    .game-card-icon {
        font-size: 2.8em;
        flex-shrink: 0;
    }

    .game-card-info h3 {
        color: #f4d03f;
        font-size: 1.2em;
        margin-bottom: 5px;
    }

    .game-card-info p {
        color: #b8956a;
        font-size: 0.9em;
        line-height: 1.4;
    }

    .game-card-tag {
        display: inline-block;
        margin-top: 8px;
        font-size: 0.75em;
        padding: 3px 10px;
        border-radius: 12px;
        background: rgba(201,162,39,0.2);
        color: #f4d03f;
        border: 1px solid rgba(201,162,39,0.4);
    }

    .stats {
        display: flex;
        justify-content: space-around;
        background: rgba(201,162,39,0.1);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid rgba(201,162,39,0.3);
    }

    .stat { text-align: center; }
    .stat-value { font-size: 1.8em; font-weight: bold; color: #c9a227; }
    .stat-label { font-size: 0.85em; color: #b8956a; }

    .progress-bar {
        height: 8px;
        background: rgba(0,0,0,0.4);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 20px;
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #c9a227, #f4d03f);
        width: 0%;
        transition: width 0.4s ease;
    }

    .question {
        font-size: 1.2em;
        line-height: 1.5;
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(201,162,39,0.08);
        border-left: 4px solid #c9a227;
        border-radius: 8px;
    }

    .answers { display: flex; flex-direction: column; gap: 12px; }

    .answer-btn {
        padding: 16px 20px;
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(201,162,39,0.4);
        border-radius: 12px;
        color: #f5e6d3;
        font-size: 1em;
        text-align: left;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    .answer-btn:hover:not(:disabled) {
        background: rgba(201,162,39,0.2);
        border-color: #c9a227;
        transform: translateX(6px);
    }

    .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }

    .answer-btn.correct {
        background: rgba(39, 174, 96, 0.35);
        border-color: #27ae60;
    }

    .answer-btn.wrong {
        background: rgba(231, 76, 60, 0.35);
        border-color: #e74c3c;
    }

    .explanation {
        margin-top: 18px;
        padding: 15px;
        background: rgba(201,162,39,0.12);
        border-radius: 10px;
        border-left: 4px solid #c9a227;
        display: none;
        line-height: 1.5;
    }

    .btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 16px;
        background: linear-gradient(135deg, #c9a227, #f4d03f);
        color: #2c1810;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(201,162,39,0.5);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.08);
        color: #f5e6d3;
        border: 2px solid rgba(201,162,39,0.4);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .final-title {
        font-size: 2.2em;
        text-align: center;
        margin-bottom: 15px;
        color: #c9a227;
    }

    .final-message {
        text-align: center;
        font-size: 1.1em;
        line-height: 1.6;
        padding: 20px;
        background: rgba(201,162,39,0.1);
        border-radius: 12px;
        margin-bottom: 15px;
    }

    .grade {
        font-size: 1.5em;
        font-weight: bold;
        display: block;
        margin-top: 10px;
        color: #c9a227;
    }

    .back-btn {
        background: transparent;
        border: none;
        color: #b8956a;
        cursor: pointer;
        font-size: 0.95em;
        padding: 8px 0;
        margin-bottom: 10px;
    }

    .back-btn:hover { color: #c9a227; }

    .game-title-header {
        text-align: center;
        color: #c9a227;
        font-size: 1.4em;
        margin-bottom: 15px;
    }

    .difficulty {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .diff-btn {
        padding: 10px 20px;
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(201,162,39,0.4);
        border-radius: 25px;
        color: #f5e6d3;
        cursor: pointer;
        font-size: 0.95em;
    }

    .diff-btn:hover { background: rgba(201,162,39,0.2); }

    .diff-btn.active {
        background: linear-gradient(135deg, #c9a227, #f4d03f);
        color: #2c1810;
        font-weight: bold;
        border-color: #f4d03f;
    }

    .difficulty-title {
        text-align: center;
        color: #c9a227;
        margin-bottom: 10px;
        font-size: 1em;
    }

    .score-summary {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 15px 0;
        flex-wrap: wrap;
    }

    .score-summary-item { text-align: center; }
    .score-summary-item .value { font-size: 1.6em; font-weight: bold; color: #f4d03f; }
    .score-summary-item .label { font-size: 0.85em; color: #b8956a; }
</style>
</head>
<body>

<div class="container">

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menuScreen" class="screen active">
        <div class="hero-emblem">🏰</div>
        <h1>Исторические игры</h1>
        <p class="subtitle">Для 6-7 класса</p>
        <p class="menu-intro">Выбери игру и проверь свои знания по истории!</p>

        <div class="games-grid">
            <button class="game-card" onclick="openGame('rus')">
                <div class="game-card-icon">🛡️</div>
                <div class="game-card-info">
                    <h3>История Древней Руси</h3>
                    <p>От Рюрика до Ивана Грозного: князья, битвы, крещение.</p>
                    <span class="game-card-tag">15 вопросов</span>
                </div>
            </button>

            <button class="game-card" onclick="openGame('medieval')">
                <div class="game-card-icon">⚔️</div>
                <div class="game-card-info">
                    <h3>История Средних веков</h3>
                    <p>Рыцари, замки, Крестовые походы и великие события Европы.</p>
                    <span class="game-card-tag">15 вопросов</span>
                </div>
            </button>
        </div>
    </div>

    <!-- ВЫБОР СЛОЖНОСТИ -->
    <div id="setupScreen" class="screen">
        <button class="back-btn" onclick="goToMenu()">← Назад в меню</button>
        <div class="game-title-header" id="setupTitle"></div>
        <p class="menu-intro" id="setupDesc"></p>

        <div class="difficulty-title">Выберите сложность:</div>
        <div class="difficulty">
            <button class="diff-btn active" data-diff="easy" onclick="selectDifficulty(this)">🟢 Лёгкая</button>
            <button class="diff-btn" data-diff="medium" onclick="selectDifficulty(this)">🟡 Средняя</button>
            <button class="diff-btn" data-diff="hard" onclick="selectDifficulty(this)">🔴 Сложная</button>
        </div>

        <button class="btn" onclick="startGame()">🚀 Начать игру</button>
    </div>

    <!-- ИГРА -->
    <div id="gameScreen" class="screen">
        <button class="back-btn" onclick="goToMenu()">← Выйти в меню</button>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="scoreDisplay">0</div>
                <div class="stat-label">⭐ Очки</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="livesDisplay">❤️❤️❤️</div>
                <div class="stat-label">Жизни</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="questionNum">1/15</div>
                <div class="stat-label">Вопрос</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="question" id="questionText"></div>
        <div class="answers" id="answersContainer"></div>

        <div class="explanation" id="explanation"></div>
        <button class="btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">➡️ Следующий вопрос</button>
    </div>

    <!-- ФИНАЛ -->
    <div id="finalScreen" class="screen">
        <h2 class="final-title">🏆 Игра окончена!</h2>

        <div class="score-summary">
            <div class="score-summary-item">
                <div class="value" id="finalScore">0</div>
                <div class="label">⭐ Очки</div>
            </div>
            <div class="score-summary-item">
                <div class="value" id="finalCorrect">0</div>
                <div class="label">✅ Правильных</div>
            </div>
            <div class="score-summary-item">
                <div class="value" id="finalTotal">0</div>
                <div class="label">📚 Всего</div>
            </div>
        </div>

        <div class="final-message" id="finalMessage"></div>

        <button class="btn" onclick="playAgain()">🔄 Играть снова</button>
        <button class="btn btn-secondary" onclick="goToMenu()">🏠 В главное меню</button>
    </div>

</div>

<script>
// =============== ВОПРОСЫ: ДРЕВНЯЯ РУСЬ ===============
const rusQuestions = [
    { level: 1, q: "В каком году произошло Крещение Руси?",
      options: ["862 г.", "988 г.", "1147 г.", "1240 г."],
      correct: 1, explanation: "Князь Владимир Святославич крестил Русь в 988 году." },
    { level: 1, q: "Кто был первым князем Древней Руси?",
      options: ["Игорь", "Олег", "Рюрик", "Святослав"],
      correct: 2, explanation: "Рюрик стал первым князем в 862 году." },
    { level: 1, q: "В каком году произошла Невская битва?",
      options: ["1240 г.", "1242 г.", "1380 г.", "1147 г."],
      correct: 0, explanation: "Александр Невский разбил шведов на Неве в 1240 году." },
    { level: 1, q: "Кто разбил Мамая на Куликовом поле?",
      options: ["Иван III", "Дмитрий Донской", "Иван Калита", "Александр Невский"],
      correct: 1, explanation: "Дмитрий Донской одержал победу в 1380 году." },
    { level: 1, q: "Кто был первым русским царём?",
      options: ["Иван III", "Иван IV Грозный", "Пётр I", "Борис Годунов"],
      correct: 1, explanation: "Иван IV Грозный в 1547 году принял титул царя." },
    { level: 2, q: "В каком году произошло Ледовое побоище?",
      options: ["1240 г.", "1242 г.", "1380 г.", "1480 г."],
      correct: 1, explanation: "5 апреля 1242 года на Чудском озере." },
    { level: 2, q: "В каком году произошла Куликовская битва?",
      options: ["1380 г.", "1240 г.", "1480 г.", "1147 г."],
      correct: 0, explanation: "Куликовская битва — 8 сентября 1380 года." },
    { level: 2, q: "Кто освободил Русь от монголо-татарского ига?",
      options: ["Иван Калита", "Дмитрий Донской", "Иван III", "Иван Грозный"],
      correct: 2, explanation: "Иван III в 1480 году после стояния на Угре." },
    { level: 2, q: "В каком году Москва впервые упоминается в летописи?",
      options: ["862 г.", "988 г.", "1147 г.", "1240 г."],
      correct: 2, explanation: "Москва впервые упомянута в 1147 году." },
    { level: 2, q: "Кто возглавил Второе народное ополчение в 1612 году?",
      options: ["Минин и Пожарский", "Лжедмитрий I", "Борис Годунов", "Василий Шуйский"],
      correct: 0, explanation: "Кузьма Минин и Дмитрий Пожарский освободили Москву в 1612 году." },
    { level: 3, q: "Что такое феодальная раздробленность?",
      options: ["Объединение земель вокруг Москвы", "Распад государства на отдельные княжества", "Война с монголами", "Крещение Руси"],
      correct: 1, explanation: "Распад единого государства на независимые части (XII–XV вв.)." },
    { level: 3, q: "Кто написал «Повесть временных лет»?",
      options: ["Нестор", "Иларион", "Даниил Заточник", "Кирилл Туровский"],
      correct: 0, explanation: "Монах Нестор создал летопись в начале XII века." },
    { level: 3, q: "В каком году было взятие Казани Иваном Грозным?",
      options: ["1547 г.", "1552 г.", "1565 г.", "1584 г."],
      correct: 1, explanation: "Казань взята в 1552 году." },
    { level: 3, q: "Что такое опричнина?",
      options: ["Совет при царе", "Особое войско и политика террора Ивана Грозного", "Налог на землю", "Название города"],
      correct: 1, explanation: "Опричнина (1565-1572) — политика террора Ивана Грозного." },
    { level: 3, q: "В каком году началось Смутное время?",
      options: ["1584 г.", "1598 г.", "1605 г.", "1613 г."],
      correct: 1, explanation: "Смутное время началось в 1598 году." }
];

// =============== ВОПРОСЫ: СРЕДНИЕ ВЕКА ===============
const medievalQuestions = [
    { level: 1, q: "Что такое феод?",
      options: ["Земельное владение за службу", "Название замка", "Оружие рыцаря", "Церковный праздник"],
      correct: 0, explanation: "Феод — земельное владение, даваемое вассалу за службу." },
    { level: 1, q: "Кто такой рыцарь?",
      options: ["Городской ремесленник", "Конный воин в тяжёлых доспехах", "Крестьянин", "Монах"],
      correct: 1, explanation: "Рыцарь — конный воин, принадлежавший к феодальной знати." },
    { level: 1, q: "Что такое замок?",
      options: ["Городской рынок", "Укреплённое жилище феодала", "Церковь", "Крестьянская хижина"],
      correct: 1, explanation: "Замок — укреплённое жилище феодала." },
    { level: 1, q: "Как называлась эпоха между Античностью и Новым временем?",
      options: ["Каменный век", "Средневековье", "Ренессанс", "Новейшее время"],
      correct: 1, explanation: "Средневековье — V–XV века." },
    { level: 1, q: "Кто жил в замке и управлял землями?",
      options: ["Крестьяне", "Феодал (сеньор)", "Ремесленники", "Горожане"],
      correct: 1, explanation: "Феодал владел землёй и управлял ей." },
    { level: 2, q: "Что такое Крестовые походы?",
      options: ["Восстания крестьян", "Военные походы европейцев на Восток", "Торговые путешествия", "Морские открытия"],
      correct: 1, explanation: "Крестовые походы (XI–XIII вв.) — походы на Ближний Восток." },
    { level: 2, q: "Какая эпидемия в XIV веке унесла треть населения Европы?",
      options: ["Холера", "Чума («Чёрная смерть»)", "Оспа", "Грипп"],
      correct: 1, explanation: "Чума 1347-1351 гг. унесла треть населения Европы." },
    { level: 2, q: "Что изобрёл Иоганн Гутенберг в XV веке?",
      options: ["Порох", "Книгопечатный станок", "Компас", "Телескоп"],
      correct: 1, explanation: "Около 1450 года Гутенберг изобрёл книгопечатание." },
    { level: 2, q: "Что такое вассалитет?",
      options: ["Отношения между сеньором и вассалом", "Городская торговля", "Церковный обряд", "Вид оружия"],
      correct: 0, explanation: "Вассал служит сеньору, сеньор защищает вассала." },
    { level: 2, q: "Кто такой Карл Великий?",
      options: ["Король Англии", "Император франков, коронован в 800 году", "Папа Римский", "Монгольский хан"],
      correct: 1, explanation: "Карл Великий — король франков, император с 800 года." },
    { level: 3, q: "Что такое инквизиция?",
      options: ["Церковный суд для борьбы с ересью", "Рыцарский орден", "Городской совет", "Вид налога"],
      correct: 0, explanation: "Инквизиция — суд католической церкви против еретиков." },
    { level: 3, q: "Что такое Великая хартия вольностей?",
      options: ["Договор о торговле", "Документ, ограничивший власть короля в 1215 г.", "Церковный устав", "Военный союз"],
      correct: 1, explanation: "Хартия 1215 г. ограничила власть английского короля." },
    { level: 3, q: "В каком году пала Византия?",
      options: ["1204 г.", "1356 г.", "1453 г.", "1492 г."],
      correct: 2, explanation: "В 1453 году турки захватили Константинополь." },
    { level: 3, q: "Кто такой Жанна д’Арк?",
      options: ["Королева Франции", "Героиня Столетней войны", "Монахиня", "Испанская принцесса"],
      correct: 1, explanation: "Жанна д’Арк возглавила французские войска в 1429 году." },
    { level: 3, q: "Что такое Реконкиста?",
      options: ["Завоевание земель в Америке", "Отвоевание Пиренейского полуострова у арабов", "Крестьянское восстание", "Церковная реформа"],
      correct: 1, explanation: "Реконкиста (VIII–XV вв.) — отвоевание Испании у мусульман." }
];

// =============== ИГРЫ ===============
const GAMES = {
    rus: {
        title: "История Древней Руси",
        description: "Проверьте знания о князьях, битвах и объединении русских земель.",
        questions: rusQuestions
    },
    medieval: {
        title: "История Средних веков",
        description: "Рыцари, замки, Крестовые походы, эпидемии и великие события Европы.",
        questions: medievalQuestions
    }
};

// =============== СОСТОЯНИЕ ===============
let currentGameKey = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let lives = 3;
let answered = false;
let difficulty = 'easy';

// =============== ЭЛЕМЕНТЫ ===============
const menuScreen   = document.getElementById('menuScreen');
const setupScreen  = document.getElementById('setupScreen');
const gameScreen   = document.getElementById('gameScreen');
const finalScreen  = document.getElementById('finalScreen');

const setupTitle   = document.getElementById('setupTitle');
const setupDesc    = document.getElementById('setupDesc');

const questionText = document.getElementById('questionText');
const answersContainer = document.getElementById('answersContainer');
const explanation  = document.getElementById('explanation');
const nextBtn      = document.getElementById('nextBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const questionNum  = document.getElementById('questionNum');
const progressFill = document.getElementById('progressFill');

const finalScore   = document.getElementById('finalScore');
const finalCorrect = document.getElementById('finalCorrect');
const finalTotal   = document.getElementById('finalTotal');
const finalMessage = document.getElementById('finalMessage');

// =============== НАВИГАЦИЯ ===============
function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToMenu() {
    showScreen(menuScreen);
}

function openGame(gameKey) {
    currentGameKey = gameKey;
    const game = GAMES[gameKey];
    setupTitle.textContent = '🎯 ' + game.title;
    setupDesc.textContent = game.description;
    difficulty = 'easy';
    document.querySelectorAll('.diff-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.diff === 'easy');
    });
    showScreen(setupScreen);
}

function selectDifficulty(btn) {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
}

// =============== УТИЛИТЫ ===============
function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// =============== СТАРТ ИГРЫ ===============
function startGame() {
    if (!currentGameKey) return;

    const all = GAMES[currentGameKey].questions;

    let pool;
    if (difficulty === 'easy') {
        pool = all.filter(q => q.level === 1);
    } else if (difficulty === 'medium') {
        pool = all.filter(q => q.level <= 2);
    } else {
        pool = all;
    }

    currentQuestions = shuffle(pool);
    currentIndex = 0;
    score = 0;
    lives = 3;
    answered = false;

    updateStats();
    showScreen(gameScreen);
    loadQuestion();
}

// =============== ЗАГРУЗКА ВОПРОСА ===============
function loadQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];

    progressFill.style.width = (currentIndex / currentQuestions.length * 100) + '%';
    questionNum.textContent = (currentIndex + 1) + '/' + currentQuestions.length;

    questionText.textContent = '📖 ' + q.q;
    answersContainer.innerHTML = '';
    explanation.style.display = 'none';
    nextBtn.style.display = 'none';

    const letters = ['А', 'Б', 'В', 'Г'];
    q.options.forEach((option, i) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = '<b>' + letters[i] + ')</b> ' + option;
        btn.onclick = () => checkAnswer(i, btn);
        answersContainer.appendChild(btn);
    });
}

// =============== ПРОВЕРКА ОТВЕТА ===============
function checkAnswer(selected, btn) {
    if (answered) return;
    answered = true;

    const q = currentQuestions[currentIndex];
    const buttons = answersContainer.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);

    if (selected === q.correct) {
        btn.classList.add('correct');
        score += 10;
        explanation.innerHTML = '✅ <b>Правильно!</b><br>' + q.explanation;
    } else {
        btn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        lives--;
        explanation.innerHTML = '❌ <b>Неверно.</b> Правильный ответ: <b>'
            + q.options[q.correct] + '</b><br>' + q.explanation;
    }

    explanation.style.display = 'block';
    updateStats();

    if (lives <= 0) {
        nextBtn.textContent = '🏁 Завершить игру';
    } else if (currentIndex === currentQuestions.length - 1) {
        nextBtn.textContent = '🏆 Показать результат';
    } else {
        nextBtn.textContent = '➡️ Следующий вопрос';
    }
    nextBtn.style.display = 'block';
}

// =============== СЛЕДУЮЩИЙ ВОПРОС ===============
function nextQuestion() {
    if (lives <= 0 || currentIndex === currentQuestions.length - 1) {
        finishGame();
        return;
    }
    currentIndex++;
    loadQuestion();
}

// =============== СТАТИСТИКА ===============
function updateStats() {
    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
}

// =============== ФИНАЛ ===============
function finishGame() {
    progressFill.style.width = '100%';
    finalScore.textContent = score;
    finalCorrect.textContent = score / 10;
    finalTotal.textContent = currentQuestions.length;
    showScreen(finalScreen);

    const total = currentQuestions.length;
    const correctCount = score / 10;
    const percent = Math.round(correctCount / total * 100);

    let msg, grade;
    if (percent >= 90) {
        msg = "🌟 Превосходно! Вы настоящий знаток истории!";
        grade = "Оценка: 5";
    } else if (percent >= 70) {
        msg = "👍 Отличный результат!";
        grade = "Оценка: 4";
    } else if (percent >= 50) {
        msg = "📖 Неплохо, но стоит повторить материал.";
        grade = "Оценка: 3";
    } else {
        msg = "📚 Попробуйте ещё раз!";
        grade = "Оценка: 2";
    }

    finalMessage.innerHTML = 'Правильных ответов: <b>' + correctCount + ' из ' + total + '</b><br>'
        + msg + '<span class="grade">' + grade + '</span>';
}

// =============== ИГРАТЬ СНОВА ===============
function playAgain() {
    showScreen(setupScreen);
}
</script>

</body>
</html>
